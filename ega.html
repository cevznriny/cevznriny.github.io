        function timeAgo(dateString) {
            const now = new Date();
            const pastDate = new Date(dateString);
            const seconds = Math.floor((now - pastDate) / 1000);
            const minutes = Math.floor(seconds / 60);
            const hours = Math.floor(minutes / 60);
            const days = Math.floor(hours / 24);
            const months = Math.floor(days / 30); 
            const years = Math.floor(months / 12); 

            if (seconds < 60) {
                return `${seconds} second${seconds !== 1 ? 's' : ''} ago`;
            } else if (minutes < 60) {
                return `${minutes} minute${minutes !== 1 ? 's' : ''} ago`;
            } else if (hours < 24) {
                return `${hours} hour${hours !== 1 ? 's' : ''} ago`;
            } else if (days < 30) {
                return `${days} day${days !== 1 ? 's' : ''} ago`;
            } else if (months < 12) {
                return `${months} month${months !== 1 ? 's' : ''} ago`;
            } else {
                return `${years} year${years !== 1 ? 's' : ''} ago`;
            }
        }

        
        const dateStr = "2026-11-11 14:34"; 
        document.getElementById("timeAgo").textContent = timeAgo(dateStr);

<script>
document.addEventListener("DOMContentLoaded", () => {
  const fold = s => s.toLowerCase().replace(/æ/g, "ae").replace(/ø/g, "oe").replace(/å/g, "aa")
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  const figs = [...document.querySelectorAll("figure")].map(f => {
    const cap = f.querySelector("figcaption");
    return [f, fold(cap ? cap.textContent : f.textContent)];
  });
  const q = document.getElementById("birdQ"), n = document.getElementById("birdN");
  function apply() {
    const words = fold(q.value.trim()).split(/\s+/).filter(Boolean);
    let shown = 0;
    for (const [f, text] of figs) {
      const ok = words.every(w => text.includes(w));
      f.hidden = !ok;
      if (ok) shown++;
    }
    n.textContent = words.length ? shown + " of " + figs.length : "";
    const url = new URL(location.href);
    if (q.value.trim()) url.searchParams.set("q", q.value.trim()); else url.searchParams.delete("q");
    history.replaceState(null, "", url);
  }
  q.value = new URLSearchParams(location.search).get("q") || "";
  q.addEventListener("input", () => {
    apply();
    // the list can get much shorter: show the matches from the top
    scrollTo(0, 0);
  });
  if (q.value) apply();
});
</script>
